# READY-WAIT: ready/<ID> files that arrive before the desk lists the step (pre-generated waves) are kept by cloud-pr
# (result 'waiting'). This job polls the listing every 10 s and dispatches cloud-pr on each such branch the moment
# its step is listed: PRs only, no desk calls here (cloud-pr itself makes no desk call for unheld steps).
# Cron every 5 min, one job at a time, up to 58 min each.
name: ready-wait

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: Start the next run when this one ends (keeps the job alive without cron)
        type: boolean
        default: false
      minutes:
        description: Longest run in minutes
        type: string
        default: '58'

permissions:
  contents: read
  actions: read

concurrency:
  group: ready-wait
  cancel-in-progress: false

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Dispatch cloud-pr for kept ready/ branches once listed
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          MINUTES: ${{ inputs.minutes || '58' }}
          W: ${{ github.workspace }}
        shell: bash
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::no PR_TOKEN secret: stop"; exit 1; }
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=58;; esac
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          python3 -I src/.github/cloud-pr/readywait.py 2>&1 | tee "$W/rw.log"
          grep -E " (BATCH|BATCH-PUSH-FAIL|BATCH-NO-RUN|DROP|SKIP|end:) " "$W/rw.log" | tail -80 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Start the next run (schedules do not fire on this fork)
        if: always() && (github.event_name == 'schedule' || inputs.chain)
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        shell: bash
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::no PR_TOKEN secret: no next run"; exit 1; }
          for i in 1 2 3 4 5; do gh workflow run ready-wait.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true && exit 0; sleep $((i * 10)); done
          echo "could not start the next run"; exit 1
      - name: Queue delay (B13, measurement only, never fails the job)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I "$GITHUB_WORKSPACE/src/.github/cloud-pr/qdelay.py" run || true
