# PUSH CANARY (W6, Lead 08:50 UTC 27 Nov): the real branch push of submit() on the real runner, 3 L-drill units,
# head branches pushcanary/<tag>/<id> on THIS fork, no PR and no create call. Start: push branch
# pushcanary-run/<tag> (lowercase letters and digits) at a commit that has this file. Branches deleted at the end.
name: pushcanary

on:
  push:
    branches: ['pushcanary-run/**']

permissions:
  contents: read

concurrency:
  group: pushcanary-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Three real pushes and a fresh-clone check
        env:
          W: ${{ github.workspace }}/work
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          [ -n "${PR_TOKEN:-}" ] || { echo "::error::no PR_TOKEN"; exit 1; }
          export PC_TAG=$(echo "${GITHUB_REF_NAME#pushcanary-run/}" | tr -cd 'a-z0-9' | cut -c1-12)
          git --version; nproc
          python3 -I src/.github/cloud-pr/pushcanary.py; rc=$?
          b=$(echo -n "x-access-token:$PR_TOKEN" | base64 -w0)
          for i in 1 2 3; do
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b" push -q "https://github.com/$GITHUB_REPOSITORY.git" \
              --delete "refs/heads/pushcanary/$PC_TAG/L-drill-$PC_TAG-$i" && echo "deleted pushcanary/$PC_TAG/L-drill-$PC_TAG-$i"
          done
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b" push -q "https://github.com/$GITHUB_REPOSITORY.git" \
            --delete "refs/heads/$GITHUB_REF_NAME" && echo "deleted $GITHUB_REF_NAME"
          exit $rc
