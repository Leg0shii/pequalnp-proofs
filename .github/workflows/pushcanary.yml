# PUSH CANARY (W6, Lead 08:50 UTC 27 Nov): the real branch push of submit() on the real runner, 3 L-drill units,
# head branches pushcanary/<tag>/<id> on THIS fork, no PR and no create call. Start: push branch
# pushcanary-run/<tag> (lowercase letters and digits) at a commit that has this file. Branches deleted at the end.
name: pushcanary

on:
  push:
    branches: ['pushcanary-run/**']

permissions:
  contents: read

concurrency:
  group: pushcanary-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Three real pushes and a fresh-clone check
        env:
          W: ${{ github.workspace }}/work
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set +e -uo pipefail
          [ -n "${PR_TOKEN:-}" ] || { echo "::error::no PR_TOKEN"; exit 1; }
          export PC_TAG=$(echo "${GITHUB_REF_NAME#pushcanary-run/}" | tr -cd 'a-z0-9' | cut -c1-12)
          git --version; nproc
          if [[ "$PC_TAG" == pb* ]]; then
            python3 -I src/.github/cloud-pr/pushbatch_canary.py; rc=$?      # lane pushbatch: 60 units, PUSH_BATCH_S=10
          else
            python3 -I src/.github/cloud-pr/pushcanary.py; rc=$?
          fi
          b=$(echo -n "x-access-token:$PR_TOKEN" | base64 -w0)
          u="https://github.com/$GITHUB_REPOSITORY.git"; h="http.https://github.com/.extraheader=AUTHORIZATION: basic $b"
          refs=$(git -C src -c "$h" ls-remote "$u" | awk '$2 ~ /^refs\/heads\/((pushcanary(-run)?|upbase)\/|utest\/L-drill-)/{print $2}')
          # ONE multi-ref delete push (GitHub: at most 6 pushes a minute per repository)
          [ -z "$refs" ] || { git -C src -c "$h" push -q "$u" --delete $refs && echo "deleted $(echo $refs | wc -w) refs in one push"; }
          exit $rc
