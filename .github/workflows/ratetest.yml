# CANARY R (Lead 07:23 / 07:24 UTC 27 Nov): the real PR-create rate ceiling of the PR_TOKEN account, INSIDE this fork
# only (never upstream). HELD: runs only when the Lead's "CANARY R GO" is relayed and infra pushes the branch
# canaryr/<x>-r<MAX_RATE> (the ramp 20, 30, 45, 60, 70 a minute in 30 s steps, capped at MAX_RATE, at most 115 creates,
# stop at the first 403/429 with no retry). Scratch branches ratetest/base and ratetest/h-NNN are parentless commits
# with no workflows (no pull_request runs); every PR is closed at 20 a minute and the branches are deleted at the end,
# also when the ramp fails.
name: ratetest

on:
  push:
    branches: ['canaryr/**']

permissions:
  contents: write          # the scratch branches (pushed and deleted with this run's own token)
  pull-requests: read

concurrency:
  group: ratetest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ramp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SRC: ${{ github.workspace }}/src
      W: ${{ github.workspace }}/work
      FORK: ${{ github.repository }}
      PR_TOKEN: ${{ secrets.PR_TOKEN }}
      RUN_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: MAX_RATE from the branch name, rate limits before
        run: |
          set -euo pipefail
          [ "$FORK" != "open-goat/pequalnp-proofs" ] || { echo "::error::never upstream"; exit 1; }
          [ -n "${PR_TOKEN:-}" ] || { echo "::error::no PR_TOKEN secret"; exit 1; }
          case "$GITHUB_REF_NAME" in *-r[0-9]*) MR=${GITHUB_REF_NAME##*-r};; *) echo "::error::branch must end in -r<MAX_RATE>"; exit 1;; esac
          [ "$MR" -ge 1 ] && [ "$MR" -le 70 ] || { echo "::error::MAX_RATE $MR outside 1..70"; exit 1; }
          echo "MAX_RATE=$MR" >> "$GITHUB_ENV"; echo "MAX_RATE $MR"
          mkdir -p "$W"
          echo "RATE-LIMIT before PR_TOKEN core: $(GH_TOKEN=$PR_TOKEN gh api rate_limit --jq '.resources.core | "limit \(.limit) remaining \(.remaining) used \(.used) reset \(.reset)"')"
          echo "RATE-LIMIT run token (GITHUB_TOKEN) core.limit: $(GH_TOKEN=$RUN_TOKEN gh api rate_limit --jq '.resources.core | "limit \(.limit) remaining \(.remaining)"')"
      - name: Scratch branches (parentless, no workflows)
        run: |
          set -euo pipefail
          g="$W/rt.git"; git init -q --bare "$g"
          export GIT_DIR="$g" GIT_AUTHOR_NAME=Leg0shii GIT_COMMITTER_NAME=Leg0shii \
            GIT_AUTHOR_EMAIL=46093332+Leg0shii@users.noreply.github.com GIT_COMMITTER_EMAIL=46093332+Leg0shii@users.noreply.github.com
          mk() { b=$(printf '%s\n' "$2" | git hash-object -w --stdin); printf '100644 blob %s\t%s\n' "$b" "$1" | git mktree; }
          base=$(git commit-tree "$(mk README.txt 'rate test base')" -m "rate test base")
          refs=("$base:refs/heads/ratetest/base")
          for n in $(seq 1 115); do
            f=$(printf 'h-%03d' "$n")
            t=$(printf '100644 blob %s\tREADME.txt\n100644 blob %s\t%s.txt\n' \
                "$(printf '%s\n' 'rate test base' | git hash-object -w --stdin)" \
                "$(printf 'rate test %s\n' "$n" | git hash-object -w --stdin)" "$f" | git mktree)
            c=$(git commit-tree "$t" -p "$base" -m "rate test $n")
            refs+=("$c:refs/heads/ratetest/$f")
          done
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RUN_TOKEN" | base64 -w0)" \
            push -q "https://github.com/$FORK.git" "${refs[@]}"
          echo "pushed ${#refs[@]} scratch branches"
      - name: Ramp (pr_gate 8 slots, bucket 70/min, first 403/429 stops)
        run: python3 -I "$SRC/.github/cloud-pr/ratetest.py" ramp 2>&1 | tee ramp.log
      - name: Close every rate-test PR (20 a minute)
        if: always()
        run: python3 -I "$SRC/.github/cloud-pr/ratetest.py" cleanup
      - name: Delete the scratch branches
        if: always()
        run: |
          set -uo pipefail
          A="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RUN_TOKEN" | base64 -w0)"
          mapfile -t del < <(git -c http.extraheader="$A" ls-remote "https://github.com/$FORK.git" 'refs/heads/ratetest/*' | awk '{print ":"$2}')
          [ ${#del[@]} -eq 0 ] || git -c http.extraheader="$A" push -q "https://github.com/$FORK.git" "${del[@]}"
          echo "deleted ${#del[@]} scratch branches"
      - name: Report
        if: always()
        run: |
          python3 -I "$SRC/.github/cloud-pr/ratetest.py" report || true
          echo "RATE-LIMIT after PR_TOKEN core: $(GH_TOKEN=$PR_TOKEN gh api rate_limit --jq '.resources.core | "limit \(.limit) remaining \(.remaining) used \(.used) reset \(.reset)"')"
          echo "RATE-LIMIT run token (GITHUB_TOKEN) core.limit: $(GH_TOKEN=$RUN_TOKEN gh api rate_limit --jq '.resources.core | "limit \(.limit) remaining \(.remaining)"')"
