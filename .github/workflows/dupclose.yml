# DUPCLOSE (Lead 17:55 UTC 26 Nov, team/lead/PAUSE-CAUSE.md): every 20 s, close our own open PRs without a lease whose
# unit's first PR (toolkit taken list) is another author's lower-numbered PR, before the desk's checker rejects them as
# second proofs (bursts of those start our pauses). 58-min jobs, one at a time, chained by self-dispatch (no cron here).
# 3 or more duplicates in one pass -> toolkit ref alert/dupopen-<epoch> "DUP-OPEN n" (relayed to the bus alert channel).
name: dupclose

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Longest run in minutes
        type: string
        default: '58'
      chain:
        description: Start the next run when this one ends (schedules do not fire on this fork)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: dupclose
  cancel-in-progress: false

jobs:
  dupclose:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Close our duplicate PRs every 20 s
        env:
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          IN_MIN: ${{ inputs.minutes }}
          DUPCLOSE_PRUNE: ${{ vars.DUPCLOSE_PRUNE || '0' }}    # Lead 09:18: head-branch prune off unless the variable says 1
        run: |
          [ -n "${PR_TOKEN:-}" ] || { echo "::error::no PR_TOKEN secret: stop"; exit 1; }
          MIN=${IN_MIN:-58}; case "$MIN" in ''|*[!0-9]*) MIN=58;; esac
          MINUTES=$MIN W=$GITHUB_WORKSPACE/work python3 -I "$GITHUB_WORKSPACE/src/.github/cloud-pr/dupclose.py"
      - name: Chain the next run (schedules do not fire on this fork)
        if: always() && (github.event_name == 'schedule' || inputs.chain)
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do gh workflow run dupclose.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true && exit 0; sleep $((i * 10)); done
          echo "could not start the next run"; exit 1
      - name: Queue delay (B13, measurement only, never fails the job)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I "$GITHUB_WORKSPACE/src/.github/cloud-pr/qdelay.py" run || true
