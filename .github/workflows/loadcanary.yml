# LIVE DRY LOAD CANARY (Lead 06:30 UTC 27 Nov): the real drain.py on a real runner, at the wave setting, over the
# test refs loadtest/<ID> (each one commit with ready/<MOD>.lean, like a ready/ push). Every submit.py runs DRY: guards,
# race check, rival snapshot, no desk claim, no push, no PR. State goes to drain-state-loadtest, never drain-state.
# Reports: per-unit prep and submit times (p50/p95), runner CPU (vmstat every 2 s), results.
# Start: push the candidate sha as branch loadcanary/<anything> (a push runs the workflow file of the pushed commit, so
# this works before the file is on main); or dispatch once it is on main. The drain code is that ref, not main.
name: loadcanary

on:
  push:
    branches: ['loadcanary/**']
  workflow_dispatch:
    inputs:
      ref:
        description: commit or branch to test (empty = the dispatched branch)
        type: string
        default: ''
      workers:
        description: DRAIN_WORKERS
        type: string
        default: '28'
      warm_s:
        description: DRAIN_WARM_S (refresher runs this long before units are released)
        type: string
        default: '0'
      slots:
        description: DRAIN_PR_SLOTS
        type: string
        default: '8'
  # lane ci (W8, Lead 08:17): lane-ci.yml calls this on every fork-internal PR to gateway-v1
  workflow_call:
    inputs:
      ref: {type: string, default: ''}
      workers: {type: string, default: '28'}
      slots: {type: string, default: '8'}
      warm_s: {type: string, default: '0'}
    outputs:
      line:
        description: the LANE-CI summary line (lcsummary.py)
        value: ${{ jobs.load.outputs.line }}

permissions:
  contents: read
  actions: read
  pull-requests: read

# W8 (Lead 08:36): one group PER BRANCH, so lanes and the rehearsal run side by side. A DRY drain only reads the
# loadtest/* units (no claim, no push, no delete), so parallel runs cannot take each other's units; non-drill runs skip
# the rehearsal's L-drill-* units (DRAIN_MATCH below). Lanes cap themselves at 3 canaries at once (lane-ci.yml "queue").
concurrency:
  group: loadcanary-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      line: ${{ steps.lcsum.outputs.line }}
    steps:
      - name: Refuse while the wave is on (fork ref wave/on, Lead 08:49 read budget)
        run: |
          o=$(git ls-remote "https://github.com/${{ github.repository }}.git" 'refs/heads/wave/*') || { echo "::error::ls-remote failed: not starting"; exit 1; }
          # create-only switch (infra 08:59, no ref deletes): wave/on-<epoch> and wave/off-<epoch>; ON while the newest on is newer
          # than the newest off (same rule as 16.1 stop/go); a bare wave/on also counts as ON
          on=$(printf '%s\n' "$o" | sed -n 's#.*refs/heads/wave/on-\([0-9]*\)$#\1#p' | sort -n | tail -1)
          off=$(printf '%s\n' "$o" | sed -n 's#.*refs/heads/wave/off-\([0-9]*\)$#\1#p' | sort -n | tail -1)
          if printf '%s\n' "$o" | grep -q 'refs/heads/wave/on$' || { [ -n "$on" ] && [ "$on" -gt "${off:-0}" ]; }; then
            echo "::error::wave is ON (wave/on-$on newer than wave/off-${off:-none}): no canary until the Lead says WAVE OFF"; exit 1
          fi
          echo "wave off (on-${on:-none} off-${off:-none}): go"
      - name: Check out the candidate (drain.py, submit.py, guards)
        uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: GitHub core before (rate_limit is free)
        env:
          RT: ${{ github.token }}
          PT: ${{ secrets.PR_TOKEN }}
        run: |
          for t in RT PT; do GH_TOKEN=${!t} gh api rate_limit --jq .resources.core.remaining 2>/dev/null || echo "?"; done | paste -sd' ' > core.before
          cat core.before
      - name: Drain loadtest/ refs, every unit DRY
        env:
          SRC: ${{ github.workspace }}/src
          W: ${{ github.workspace }}/work
          READ_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          DRAIN_PREFIX: loadtest
          DRAIN_WORKERS: ${{ inputs.workers || vars.LOADCANARY_WORKERS || '28' }}
          DRAIN_PR_SLOTS: ${{ inputs.slots || vars.LOADCANARY_SLOTS || '8' }}
          DRAIN_REFRESHER: '1'
          DRAIN_LINGER: '20'
          DRAIN_MAX_S: '900'
          DRAIN_IDLE_POLL_S: '1'
          DRAIN_WARM_S: ${{ inputs.warm_s || '0' }}
        run: |
          set -uo pipefail
          [ -n "${PR_TOKEN:-}" ] || { echo "::error::no PR_TOKEN secret: stop"; exit 1; }
          # workers from the branch name loadcanary/<x>-w<N> (Lead 07:14: runs at 14, 20, 28)
          # branch loadcanary/<x>-w<N>[-warm<S>] (Lead 08:12: WARM_S = the refresher runs S s before the units are released)
          # rehearsal: -lin<S> = DRAIN_LINGER S, -drill = only loadtest/L-drill-* units (DRAIN_MATCH)
          # -drill-<tag>: only L-drill-<tag>-<n> units, listing from fork ref loadtest-gaps/<tag> (plain -drill: any
          # L-drill unit, ref loadtest-gaps/drill). The drill driver force-pushes that ref (tree: gaps.json) per export.
          # lane movingmain (W7): -move<S> (last suffix) = a fake upstream main that moves every S s: a local bare depth-1
          # clone of upstream main served to the drain as file:// (DRAIN_UPSTREAM), moved by movemain.py. Local, so the
          # moves push nothing to GitHub (a fork ref every 4 s = 15 pushes a minute on the fork filing pushes to).
          mv=""; case "$GITHUB_REF_NAME" in *-move[0-9]*) mv=${GITHUB_REF_NAME##*-move};; esac
          GITHUB_REF_NAME=${GITHUB_REF_NAME%-move[0-9]*}
          if [ -n "$mv" ]; then
            mkdir -p "$W"; fu="$W/fakeup.git"
            git clone -q --bare --depth 1 --single-branch --branch main https://github.com/open-goat/pequalnp-proofs.git "$fu" || exit 1
            git -C "$fu" config uploadpack.allowFilter true; git -C "$fu" config uploadpack.allowAnySHA1InWant true
            export DRAIN_UPSTREAM="file://$fu"
            python3 -I "$SRC/.github/cloud-pr/movemain.py" "$fu" "$mv" > move.log 2>&1 &
            mover=$!
            echo "fake upstream main: $fu, moves every $mv s (movemain.py pid $mover)"
          fi
          case "$GITHUB_REF_NAME" in
            *-drill-*) t=${GITHUB_REF_NAME##*-drill-}; export DRAIN_MATCH="L-drill-$t-[0-9]+" DRILL_GAPS_REF="loadtest-gaps/$t";;
            *-drill) export DRAIN_MATCH='L-drill-[a-z0-9-]+' DRILL_GAPS_REF='loadtest-gaps/drill';;
            *) export DRAIN_MATCH='(?!L-drill-).+';;      # W8: lane and plain canaries leave the rehearsal's units alone
          esac
          r=${GITHUB_REF_NAME%-drill*}
          case "$r" in *-lin[0-9]*) export DRAIN_LINGER=${r##*-lin}; r=${r%-lin*};; esac
          case "$r" in *-warm[0-9]*) export DRAIN_WARM_S=${r##*-warm};; esac
          b=${r%-warm*}
          case "$b" in *-w[0-9]*) export DRAIN_WORKERS=${b##*-w};; esac
          echo "warm $DRAIN_WARM_S linger $DRAIN_LINGER match ${DRAIN_MATCH:-all} drill gaps ${DRILL_GAPS_REF:-none}"
          echo "workers $DRAIN_WORKERS slots $DRAIN_PR_SLOTS"
          nproc; free -m | head -2
          vmstat -n 2 > cpu.log &
          vm=$!
          # what the CPU is spent on: every 0.5 s, the running (R) processes by command name
          ( while :; do ps -eo stat=,comm= | awk '$1 ~ /^R/ {print $2}'; echo "--"; sleep 0.5; done ) > run.log &
          ps_loop=$!
          t0=$(date +%s)
          python3 -I "$SRC/.github/cloud-pr/drain.py" 2>&1 | tee drain.log
          rc=${PIPESTATUS[0]}
          kill $vm $ps_loop 2>/dev/null
          if [ -n "$mv" ]; then kill $mover 2>/dev/null; echo "fake upstream main: $(grep -c '^MOVE [0-9]* [0-9a-f]' move.log) moves, $(grep -c failed move.log) failed"; fi
          grep -E "upstream base:|upstream base behind" drain.log | tail -3
          echo "drain rc=$rc wall=$(( $(date +%s) - t0 )) s"
          python3 - <<'EOF'
          import re, statistics as st
          L = open("drain.log").read().splitlines()
          def pct(v, q):
              v = sorted(v); return v[min(len(v) - 1, int(q * len(v)))] if v else float("nan")
          prep = [float(m.group(1)) for l in L for m in [re.search(r"prep=([\d.]+)", l)] if m and " TIMES " in l]
          tot = [float(m.group(1)) for l in L for m in [re.search(r" total=([\d.]+)", l)] if m and " TIMES " in l]
          snap = [float(m.group(1)) for l in L for m in [re.search(r"snap_age=([\d.]+)", l)] if m]
          res = {}
          for l in L:
              m = re.search(r"DONE \S+ (\S+)", l)
              if m: res[m.group(1)] = res.get(m.group(1), 0) + 1
          cpu = []
          for l in open("cpu.log").read().splitlines():
              p = l.split()
              if len(p) >= 17 and p[0].isdigit():
                  cpu.append(100 - int(p[14]))          # 100 - idle
          rq = [int(l.split()[0]) for l in open("cpu.log").read().splitlines() if l.split() and l.split()[0].isdigit()]
          print(f"LOADCANARY units={len(prep)} results={res}")
          print(f"LOADCANARY prep p50={pct(prep, .5):.1f}s p95={pct(prep, .95):.1f}s  submit total p50={pct(tot, .5):.1f}s p95={pct(tot, .95):.1f}s")
          import collections
          cnt = collections.Counter(l.strip() for l in open("run.log") if l.strip() and l.strip() != "--")
          tot_r = sum(cnt.values()) or 1
          print("LOADCANARY cpu by command (share of running-process samples): " +
                ", ".join(f"{k} {100 * v / tot_r:.0f}%" for k, v in cnt.most_common(8)))
          print(f"LOADCANARY snap_age max={max(snap) if snap else float('nan'):.1f}s  cpu busy avg={st.mean(cpu) if cpu else float('nan'):.0f}% max={max(cpu) if cpu else 0}%  run-queue max={max(rq) if rq else 0}")
          EOF
          grep -i "refresher" drain.log | head -3
          echo "refresher log: $(grep -c 'rival snapshot:' "$W/refresher.log" 2>/dev/null) builds"; grep 'rival snapshot:' "$W/refresher.log" 2>/dev/null | sed -n '1,3p;$p'
          grep -v 'rival snapshot:' "$W/refresher.log" 2>/dev/null | tail -5
          exit $rc
      - name: LANE-CI summary line (lane ci, W8)
        id: lcsum
        if: always()
        env:
          RT: ${{ github.token }}
          PT: ${{ secrets.PR_TOKEN }}
          IN_W: ${{ inputs.workers || vars.LOADCANARY_WORKERS || '28' }}
          IN_S: ${{ inputs.slots || vars.LOADCANARY_SLOTS || '8' }}
          IN_WARM: ${{ inputs.warm_s || '0' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
        run: |
          for t in RT PT; do GH_TOKEN=${!t} gh api rate_limit --jq .resources.core.remaining 2>/dev/null || echo "?"; done | paste -sd' ' > core.after
          read rb pb < core.before; read ra pa < core.after
          # the run token's first rate_limit answer can come from a fresh bucket (PR 3: 4999, drain 1 s later 3155):
          # take "before" from the drain's own RUN-TOKEN line, the same bucket as core.after
          d=$(grep -oE 'RUN-TOKEN rate_limit core limit/remaining: [0-9]+ [0-9]+' drain.log 2>/dev/null | head -1 | awk '{print $NF}')
          [ -n "$d" ] && rb=$d
          w=$IN_W; warm=$IN_WARM; r=${GITHUB_REF_NAME%-move[0-9]*}; r=${r%-drill*}; r=${r%-lin*}       # same branch-name rules as the drain step
          case "$r" in *-warm[0-9]*) warm=${r##*-warm}; r=${r%-warm*};; esac
          case "$r" in *-w[0-9]*) w=${r##*-w};; esac
          sha=$(git -C src rev-parse HEAD)
          line=$(python3 -I src/.github/cloud-pr/lcsummary.py drain.log --sha "$sha" --head "$HEAD_SHA" --workers "$w" --slots "$IN_S" \
                 --warm "$warm" --run "$GITHUB_RUN_ID" --reads-run "$rb,$ra" --reads-pr "$pb,$pa") ; rc=$?
          [ -n "$line" ] || line="LANE-CI $(echo $sha | cut -c1-8) head=$(echo $HEAD_SHA | cut -c1-8) verdict=BAD (no drain.log or summary error)"
          echo "$line"; echo "$line" > canary.txt
          echo "line=$line" >> "$GITHUB_OUTPUT"
          { echo '### LANE-CI'; echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Keep the summary and the drain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-ci-canary
          path: |
            canary.txt
            drain.log
          retention-days: 14
