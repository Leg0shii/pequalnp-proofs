name: nodesk
# GATEWAY v1 section 3: fails if any tracked file under .github names the desk host (deskgate on the PC is the one door)
on:
  push:
    branches: [main, desk-budget, gateway-v1]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: commit to test (empty = the caller's commit)
        type: string
        default: ''
jobs:
  nodesk:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: python3 .github/cloud-pr/nodesk.py
